# ==============================================================================
# Upstream Go API & MinIO Storage
# ==============================================================================
upstream backend_api {
    server api:8080;
    keepalive 32;
}

upstream minio_storage {
    server minio:9000;
    keepalive 32;
}

# ==============================================================================
# Backend API - HTTP (Port 80)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api-postpilot.nhavuonngoclam.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Bỏ comment 3 dòng sau khi đã có SSL để chuyển sang HTTPS
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # MinIO Public Media Storage (/fb-media/)
    location /fb-media/ {
        proxy_pass http://minio_storage/fb-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Tất cả các request còn lại đi thẳng vào Go REST API
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}


# ==============================================================================
# Upstream Go API & MinIO Storage
# ==============================================================================
upstream backend_api {
    server api:8080;
    keepalive 32;
}

upstream minio_storage {
    server minio:9000;
    keepalive 32;
}

# ==============================================================================
# Backend API - HTTP (Port 80) -> Redirect sang HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name api-postpilot.hexta.org;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Backend API - HTTPS (Port 443)
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api-postpilot.hexta.org;

    ssl_certificate /etc/letsencrypt/live/api-postpilot.hexta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-postpilot.hexta.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_timeout 1d;

    # MinIO Public Media Storage (/fb-media/)
    location /fb-media/ {
        proxy_pass http://minio_storage/fb-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Tất cả các request còn lại đi thẳng vào Go REST API
    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

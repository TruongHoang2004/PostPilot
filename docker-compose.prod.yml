services:
  # --------------------------------------------------------------------------
  # 1. Database Migrator (Chạy từ GHCR image trước khi API/Worker boot)
  # --------------------------------------------------------------------------
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/truonghoang2004/postpilot-backend:latest}
    container_name: fbposter-migrate
    command: ["/app/fb-migrate", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - infra-net

  # --------------------------------------------------------------------------
  # 2. Backend API Server (Chạy từ GHCR image)
  # --------------------------------------------------------------------------
  api:
    image: ${BACKEND_IMAGE:-ghcr.io/truonghoang2004/postpilot-backend:latest}
    container_name: fbposter-api
    restart: unless-stopped
    command: ["/app/fb-api"]
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: redis:6379
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      API_ADMIN_KEY: ${API_ADMIN_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_REGION: us-east-1
      S3_BUCKET: fb-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v20.0}
      FB_APP_ID: ${FB_APP_ID:-}
      FB_APP_SECRET: ${FB_APP_SECRET:-}
      FB_REDIRECT_URI: ${FB_REDIRECT_URI:-}
      FB_WEBHOOK_VERIFY_TOKEN: ${FB_WEBHOOK_VERIFY_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://postpilot.hexta.org}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    networks:
      - infra-net

  # --------------------------------------------------------------------------
  # 3. Background Worker & Scheduler (Chạy từ GHCR image)
  # --------------------------------------------------------------------------
  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/truonghoang2004/postpilot-backend:latest}
    container_name: fbposter-worker
    restart: unless-stopped
    command: ["/app/fb-worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: redis:6379
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      SCHEDULER_INTERVAL_SEC: ${SCHEDULER_INTERVAL_SEC:-15}
      FAST_WORKER_CONCURRENCY: ${FAST_WORKER_CONCURRENCY:-4}
      HEAVY_WORKER_CONCURRENCY: ${HEAVY_WORKER_CONCURRENCY:-2}
      RATE_LIMIT_THRESHOLD_PERCENT: ${RATE_LIMIT_THRESHOLD_PERCENT:-80}
      FB_GRAPH_VERSION: ${FB_GRAPH_VERSION:-v20.0}
      FB_APP_ID: ${FB_APP_ID:-}
      FB_APP_SECRET: ${FB_APP_SECRET:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_BUCKET: fb-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
    networks:
      - infra-net

  # --------------------------------------------------------------------------
  # 4. Next.js Studio Frontend (Chạy từ GHCR image)
  # --------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/truonghoang2004/postpilot-frontend:latest}
    container_name: fbposter-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8080
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - api
    networks:
      - infra-net

networks:
  infra-net:
    name: infra-net
    external: true

volumes:
  uploads_data:
